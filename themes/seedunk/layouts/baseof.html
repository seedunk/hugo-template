<!DOCTYPE html>
<html lang="{{ site.Language.Locale }}" dir="{{ or site.Language.Direction `ltr` }}">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  <header>
    {{ partial "header.html" . }}
  </header>
  
    <main>
        <div class="container">
        {{ block "main" . }}{{ end }}
        </div>
        <br>
    </main>
    <footer >
        {{ partial "footer.html" . }}
    </footer> 
{{- with resources.Get "bootstrap-5.0.2/js/bootstrap.bundle.min.js" }}
<script type="text/javascript" src="{{ .RelPermalink }}"></script>
{{- end }}
</body>
</html>
